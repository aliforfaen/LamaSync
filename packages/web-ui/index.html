<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- LAMA-329 phase 3: the phone nav sits at the bottom edge, so the
         viewport opts into the display cutout/home-indicator areas
         (`viewport-fit=cover`) and the shell pads itself with
         env(safe-area-inset-*). Inside the Android companion the WebView
         already sits within the native safe-drawing padding, so those insets
         resolve to 0 there and cannot double-pad. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LamaSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
