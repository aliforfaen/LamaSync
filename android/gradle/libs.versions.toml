# Version catalog — LamaSync Android companion (phase 1, wave 1).
#
# Toolchain rationale (recorded for docs; verified on 2026-09-06):
#   * Gradle 8.11.1 / AGP 8.9.3 / Kotlin 2.2.21 / JDK 17: a coherent stable
#     matrix that runs against the SDK platforms already installed on the
#     build machine (android-35), so the build provisions no new SDK
#     components. AGP 8.9 requires Gradle >= 8.11.1 and JDK >= 17.
#   * compileSdk/targetSdk 35, minSdk 26 (spec).
#   * Compose BOM 2025.07.00 -> compose 1.8.3 / material3 1.3.2, the newest
#     compose line whose artifacts compile against SDK 35.
#   * lifecycle/navigation 2.9.x and core 1.15.0 are the API-35 era stable
#     releases (core 1.16+/compose 1.9+ moved to compileSdk 36).
#   * ML Kit barcode-scanning 17.3.0 (bundled model; current stable per
#     https://developers.google.com/ml-kit/release-notes).
#   * camera 1.4.2: last CameraX line that does not require compileSdk 36.

[versions]
agp = "8.9.3"
kotlin = "2.2.21"
coreKtx = "1.15.0"
activityCompose = "1.10.1"
composeBom = "2025.07.00"
lifecycle = "2.9.4"
camera = "1.4.2"
mlkitBarcode = "17.3.0"
serializationJson = "1.8.1"
coroutines = "1.10.2"
workManager = "2.10.0"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
