# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# AndroidX is mandatory for this project.
android.useAndroidX=true
# Per-module R classes keep compile times and memory down.
android.nonTransitiveRClass=true
# Reproducible, quiet builds.
org.gradle.parallel=true
org.gradle.caching=true
